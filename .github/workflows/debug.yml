name: Debug Worker
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Curl worker check endpoints
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          echo "DOMAIN host: $DOMAIN"
          echo "--- root ---"
          curl -s -o /tmp/root.html -w "HTTP %{http_code} time %{time_total}\n" "https://$DOMAIN/" || true
          head -c 300 /tmp/root.html; echo
          echo "--- check iplocate ---"
          curl -s -w "\nHTTP %{http_code} time %{time_total}\n" "https://$DOMAIN/check?sstp=vpn:vpn@www.iplocate.io:443" || true
          echo "--- check real vpngate node ---"
          curl -s -w "\nHTTP %{http_code} time %{time_total}\n" "https://$DOMAIN/check?sstp=vpn:vpn@public-vpn-153.opengw.net:443" || true
          echo "--- python requests ---"
          python3 -c "
          import requests
          r = requests.get('https://$DOMAIN/check?sstp=vpn:vpn@www.iplocate.io:443', timeout=25)
          print('status', r.status_code)
          print(r.text[:500])
          " || true
